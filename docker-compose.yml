version: "3.8"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]

  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/civicfix
      - AI_SERVICE_URL=http://ai-service:8000
    env_file: ./backend/.env
    depends_on: [mongo, ai-service]

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    env_file: ./frontend/.env
    depends_on: [backend]

volumes:
  mongo_data:
